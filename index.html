<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Weather Dashboard | Dark Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

    <div class="container">
        <div class="weather-card">
            <h1 class="title">Weather Dashboard</h1>
            
            <div class="search-bar">
                <input type="text" id="cityInput" placeholder="Enter city name..." class="search-input">
                <button id="searchBtn" class="search-btn">🔍</button>
            </div>

            <div id="weatherDisplay" class="weather-display">
                <div id="loading" class="loading hidden"><p>Fetching weather data...</p></div>
                <div id="error" class="error hidden"><p id="errorMessage"></p></div>
                <div id="weatherData" class="weather-data hidden">
                    <h2 id="cityName"></h2>
                    <p id="country"></p>
                    <div class="temp-icon">
                        <img id="weatherIcon" src="" alt="Weather Icon">
                        <p id="temperature"></p>
                    </div>
                    <p id="description"></p>
                    <div class="weather-stats">
                        <div><p class="label">Feels Like</p><p id="feelsLike"></p></div>
                        <div><p class="label">Humidity</p><p id="humidity"></p></div>
                        <div><p class="label">Wind Speed</p><p id="windSpeed"></p></div>
                        <div><p class="label">Pressure</p><p id="pressure"></p></div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>Powered by the OpenWeatherMap API</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
